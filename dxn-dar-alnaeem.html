<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مقر DXN الدار النعيم - المتجر والكتالوج الرسمي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f6;--fg:#1b2e21;--card:#fff;--muted:#5d6f63;--line:#dfe8e1;--g:#2d6a3e;--gh:#235431;--gl:#edf5ef;--hero1:#f3f8f4;--hero2:#d3e7d8;--ticker:#14452a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--fg:#e8f1ea;--card:#17261c;--muted:#9db3a3;--line:#27402f;--g:#3f9457;--gh:#4aa763;--gl:#1b3023;--hero1:#14231a;--hero2:#1d3626;--ticker:#0a2616}}
:root[data-theme="dark"]{--bg:#0f1a13;--fg:#e8f1ea;--card:#17261c;--muted:#9db3a3;--line:#27402f;--g:#3f9457;--gh:#4aa763;--gl:#1b3023;--hero1:#14231a;--hero2:#1d3626;--ticker:#0a2616}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--fg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:60}
button,input,select{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:46px;height:46px;border-radius:12px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
h1{font-size:16px;margin:0;font-weight:800;line-height:1.3}
.sub{font-size:11px;color:var(--g);font-weight:700}
.flag{display:inline-block;width:34px;height:23px;border-radius:3px;overflow:hidden;vertical-align:middle;margin-inline-start:6px;box-shadow:0 2px 6px rgba(0,0,0,.2);transform-origin:right center;animation:wave 2.8s ease-in-out infinite}
.flag svg{width:100%;height:100%;display:block}
@keyframes wave{0%,100%{transform:perspective(160px) rotateY(-10deg) skewY(1.5deg)}50%{transform:perspective(160px) rotateY(10deg) skewY(-2deg)}}
.btn{border:0;cursor:pointer;background:var(--g);color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:12px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--gh)}
.btn.alt{background:var(--card);color:var(--g);border:1px solid var(--line)}
.badge{background:#fff;color:#14452a;border-radius:99px;padding:0 8px;font-size:12px;font-weight:900}
.ticker{background:var(--ticker);color:#fff;overflow:hidden;font-size:12px;font-weight:600;padding:6px 0}
.track{display:flex;gap:32px;width:max-content;animation:tick 55s linear infinite}
.ticker:hover .track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(50%)}}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));padding:32px 0;border-bottom:1px solid var(--line)}
.hero .wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.hero h2{font-size:clamp(22px,4vw,34px);font-weight:900;margin:8px 0;line-height:1.4}
.hero h2 span{color:var(--g)}
.hero p{color:var(--muted);margin:0 0 14px;max-width:560px}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);color:var(--g);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.pay{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;width:300px;max-width:100%}
.pay h3{margin:0 0 10px;font-size:14px;color:var(--g)}
.pay div.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;font-weight:700}
.pay div.g div{background:var(--gl);border-radius:10px;padding:9px;text-align:center}
.pay small{display:block;text-align:center;color:var(--muted);margin-top:10px;font-size:11px}
.tools{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin:24px 0 16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;max-width:100%}
.cat{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 16px;border-radius:12px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
.cat.on{background:var(--g);color:#fff;border-color:var(--g)}
.search{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:14px;width:280px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.pic{height:170px;background:linear-gradient(135deg,var(--gl),var(--hero2));display:flex;align-items:center;justify-content:center;font-size:54px;position:relative}
.pic b{position:absolute;top:8px;right:8px;background:var(--card);color:var(--g);font-size:11px;padding:3px 9px;border-radius:8px}
.pic i{position:absolute;bottom:8px;left:8px;background:var(--g);color:#fff;font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff}.card .t{padding:14px}
.card h3{font-size:15px;margin:0 0 6px;line-height:1.5}
.card p{margin:0;font-size:12px;color:var(--muted);line-height:1.7}
.foot{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line)}
.price{font-size:19px;font-weight:900;color:var(--g)}
.price small{font-size:11px;color:var(--muted);font-weight:700}
h2.sec{font-size:20px;font-weight:900;margin:8px 0 14px}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:32px}
.pages img{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted);font-size:13px}
footer{background:var(--ticker);color:#cfe3d4;text-align:center;padding:20px 16px;font-size:13px;line-height:2}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:flex;justify-content:flex-start}
.side{background:var(--card);width:100%;max-width:420px;height:100%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.side header{position:static;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--gl)}
.side header h3{margin:0;font-size:17px}
.x{border:0;background:var(--card);color:var(--fg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-weight:900}
.body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gl);border-radius:12px;padding:10px}
.item h4{margin:0;font-size:13px}.item p{margin:2px 0 0;font-size:12px;color:var(--g);font-weight:700}
.qty{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 8px}
.qty button{border:0;background:none;color:var(--fg);font-size:18px;font-weight:900;cursor:pointer}
.in{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px;font-size:14px}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:17px;padding:14px;border-top:1px solid var(--line)}
.side .btn{margin:0 14px 14px;justify-content:center;padding:13px}
@media print{header,.tools,.foot button,.ov{display:none!important}}

.tb{background:var(--gl);color:var(--g);text-align:center;font-size:12px;font-weight:700;padding:4px}
.flag.big{width:96px;height:64px;margin:0}
.promo{background:linear-gradient(90deg,#b4261f,#d97706);color:#fff;padding:12px 0}
.promo .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.cd{display:flex;gap:8px}.cd span{background:rgba(0,0,0,.28);border-radius:10px;padding:6px 10px;text-align:center;font-size:11px;min-width:54px}.cd b{display:block;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:20px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.st b{display:block;font-size:28px;color:var(--g);font-weight:900}.st span{font-size:12px;color:var(--muted)}
.off{position:absolute;top:8px;left:8px;background:#d01c1f;color:#fff;text-decoration:none;font-weight:800;font-size:12px;padding:3px 9px;border-radius:8px}
.price s{font-size:12px;color:var(--muted);font-weight:600}
[dir=ltr] .flag{transform-origin:left center}
[dir=ltr] .track{animation-name:tickL}
@keyframes tickL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
</head>

function setQ(v){S.q=v;draw(true)}
function openCart(o){S.open=o;draw()}
function add(id){const p=prods().find(x=>String(x.id)===id);if(!p)return;const x=S.cart.find(i=>i.id===id);if(x)x.qty++;else S.cart.push({id,n:p.n,f:p.f,price:eff(p),qty:1});draw()}
function qty(id,d){const x=S.cart.find(i=>i.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)S.cart=S.cart.filter(i=>i.id!==id);draw()}
const total=()=>S.cart.reduce((a,i)=>a+i.price*i.qty,0);
const count=()=>S.cart.reduce((a,i)=>a+i.qty,0);
function send(){
 if(!S.cart.length)return alert(T[S.lang].emp);
 const pm=CFG.pays.find(x=>x.k===S.pay),tr=pm.k!=="c"?" - التحويل إلى "+CFG.phone:"";
 let m=`*طلب جديد من ${CFG.name.ar}* 🌿\n────────────\n`;
 if(S.name)m+=`👤 الاسم: ${S.name}\n`;
 if(S.tel)m+=`📱 الهاتف: ${S.tel}\n`;
 m+=`📍 العنوان: ${S.city}\n💳 الدفع: ${pm.ar}${tr}\n────────────\n*المنتجات:*\n`;
 S.cart.forEach((i,k)=>{m+=`${k+1}. ${i.n} (×${i.qty}) = ${i.price*i.qty} ${CFG.cur.ar}\n`});
 m+=`────────────\n💰 *المجموع:* ${total()} ${CFG.cur.ar}`;
 window.open("https://wa.me/"+CFG.wa+"?text="+encodeURIComponent(m),"_blank");
}
function tick(){
 const c=document.getElementById("clk");
 if(c){try{c.textContent=new Intl.DateTimeFormat(S.lang==="fr"?"fr-FR":"ar-u-nu-latn",{timeZone:CFG.tz,weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date())}catch(e){c.textContent=new Date().toLocaleString()}}
 const d=document.getElementById("cd");
 if(d&&D.promo&&D.promo.end){const ms=new Date(D.promo.end)-new Date(),t=T[S.lang];
  if(isNaN(ms)){d.textContent="";return}
  if(ms<=0){d.textContent=t.ended;return}
  const v=[Math.floor(ms/864e5),Math.floor(ms/36e5)%24,Math.floor(ms/6e4)%60,Math.floor(ms/1e3)%60];
  d.innerHTML=v.map((x,i)=>`<span><b>${String(x).padStart(2,"0")}</b>${[t.d,t.h,t.m,t.s][i]}</span>`).join("")}
}
setInterval(tick,1000);
function countUp(){document.querySelectorAll("[data-n]").forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);e.textContent=Math.round(n*k);if(k<1)requestAnimationFrame(f)})(t0)});S.counted=true}
function draw(kf){
 const L=S.lang,t=T[L],ps=prods(),cats=[...new Set(ps.map(p=>p.c))],offs=ps.filter(p=>p.o>0),q=S.q.toLowerCase();
 document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";document.title=CFG.name[L];
 const list=ps.filter(p=>(S.cat==="all"||(S.cat==="off"?p.o>0:p.c===S.cat))&&(p.n+(p.f||"")).toLowerCase().includes(q));
 const ms=D.promo&&D.promo.end?new Date(D.promo.end)-new Date():0,days=ms>0?Math.ceil(ms/864e5):0;
 const stats=[[ps.length,t.st1],[cats.length,t.st2],[offs.length,t.st3],[days,t.st4]].map(x=>`<div class="st"><b data-n="${x[0]}">${S.counted?x[0]:0}</b><span>${x[1]}</span></div>`).join("");
 const tick1=[...ps,...ps].map(p=>`<span style="white-space:nowrap"><span style="color:#fcd34d">✦</span> ${esc(nm(p))} · ${eff(p)} ${cur()}</span>`).join("");
 const chips=[["all",t.all]].concat(offs.length?[["off",t.off]]:[]).concat(cats.map(c=>[c,cl(c)])).map(x=>`<button class="cat ${x[0]===S.cat?"on":""}" data-c="${esc(x[0])}" onclick="setCat(this.dataset.c)">${esc(x[1])}</button>`).join("");
 const cards=list.map(p=>`<div class="card"><div><div class="pic">${p.e}<b>${esc(cl(p.c))}</b>${p.pv?`<i>${esc(p.pv)}</i>`:""}${p.o>0?`<u class="off">-${p.o}%</u>`:""}</div><div class="t"><h3>${esc(nm(p))}</h3><p>${t.mp}: ${p.dp} ${cur()}</p></div></div><div class="foot"><div class="price">${eff(p)} <small>${cur()}</small>${p.o>0?` <s>${p.p}</s>`:""}</div><button class="btn" onclick="add('${p.id}')">${t.add}</button></div></div>`).join("");
 const items=S.cart.map(i=>`<div class="item"><div><h4>${esc(L==="fr"?(i.f||i.n):i.n)}</h4><p>${i.price*i.qty} ${cur()}</p></div><div class="qty"><button onclick="qty('${i.id}',-1)">−</button><b>${i.qty}</b><button onclick="qty('${i.id}',1)">+</button></div></div>`).join("");
 const cart=S.open?`<div class="ov" onclick="if(event.target===this)openCart(false)"><div class="side"><header><h3>${t.cartT} (${count()})</h3><button class="x" onclick="openCart(false)">✕</button></header><div class="body">${S.cart.length?items+`<h4 style="margin:10px 0 0">${t.dl}</h4><input class="in" placeholder="${t.nm}" value="${esc(S.name)}" oninput="S.name=this.value"><input class="in" type="tel" placeholder="${t.tel}" value="${esc(S.tel)}" oninput="S.tel=this.value"><input class="in" placeholder="${t.city}" value="${esc(S.city)}" oninput="S.city=this.value"><select class="in" onchange="S.pay=this.value">${CFG.pays.map(m=>`<option value="${m.k}" ${m.k===S.pay?"selected":""}>${m[L]}</option>`).join("")}</select>`:`<div class="empty">🛍️<br>${t.emp}</div>`}</div>${S.cart.length?`<div class="total"><span>${t.tot}</span><span>${total()} ${cur()}</span></div><button class="btn" onclick="send()">${t.send}</button>`:""}</div></div>`:"";
 const promo=D.promo&&D.promo.end?`<section class="promo"><div class="wrap"><div><b>🎁 ${esc(D.promo[L]||D.promo.ar)}</b><br><small>${t.end}</small></div><div class="cd" id="cd"></div><button class="btn alt" onclick="setCat('off')">${t.off}</button></div></section>`:"";
 document.getElementById("app").innerHTML=
 `<header><div class="wrap bar"><div class="brand"><div class="logo">${CFG.logo?`<img src="${CFG.logo}" alt="DXN">`:"DXN"}</div><div style="min-width:0"><h1>${esc(CFG.name[L])}${FLAG()}</h1><div class="sub">${t.sub}</div></div></div><div style="display:flex;gap:8px"><button class="btn alt" onclick="setLang('${L==="ar"?"fr":"ar"}')">🌐 ${t.lang}</button><button class="btn" onclick="openCart(true)">${t.cart} <span class="badge">${count()}</span></button></div></div><div class="tb">🕒 <span id="clk"></span></div><div class="ticker"><div class="track">${tick1}</div></div></header>`+
 promo+
 `<section class="hero"><div class="wrap"><div><span class="tag">${t.tag}</span><h2>${t.h1} <span>${t.h2}</span></h2><p>${t.hp}</p><div class="actions"><a class="btn" href="https://wa.me/${CFG.wa}" target="_blank" rel="noopener">📞 ${t.wa}: ${CFG.phone}</a></div></div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${FLAG("big")}<div class="pay"><h3>${t.pay}</h3><div class="g"><div>Bankily</div><div>Sedad</div><div>Masrifi</div><div>${L==="ar"?"نقداً":"Cash"}</div></div><small style="color:var(--fg);font-weight:800;font-size:13px">${t.tr} ${CFG.phone}</small><small>${t.loc}</small></div></div></div></section>`+
 `<section class="wrap stats">${stats}</section>`+
 `<main class="wrap"><div class="tools"><div class="cats">${chips}</div><input id="q" class="search" placeholder="${t.srch}" value="${esc(S.q)}" oninput="setQ(this.value)"></div><div class="grid">${cards||`<div class="empty" style="grid-column:1/-1">${t.none}</div>`}</div></main>`+
 `<footer>${esc(CFG.name[L])} · ${L==="ar"?"نواكشوط":"Nouakchott"}<br>${t.wa}: ${CFG.phone}<br><a href="#" onclick="admOpen();return false" style="color:#9db3a3;font-size:12px">🔒 ${L==="ar"?"الإدارة":"Admin"}</a></footer>`+cart;
 if(kf){const i=document.getElementById("q");i.focus();i.setSelectionRange(i.value.length,i.value.length)}
 if(!S.counted)countUp();
 tick();
}
/* ===== لوحة الإدارة ===== */
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function admOpen(){A.open=true;admDraw();if(A.ok)admList()}
function admClose(){A.open=false;admDraw()}
function admOut(){A.ok=false;try{sessionStorage.removeItem("dxn_adm")}catch(e){}admDraw()}
async function admLogin(){const e=document.getElementById("ae").value.trim().toLowerCase(),c=document.getElementById("ac").value;let ok=false;try{ok=e===CFG.admin.email.toLowerCase()&&await sha(c)===CFG.admin.hash}catch(x){}
 if(ok){A.ok=true;try{sessionStorage.setItem("dxn_adm","1")}catch(x){}admDraw();admList()}else document.getElementById("am").textContent="البريد أو الكود غير صحيح"}
function admDraw(){
 const el=document.getElementById("adm");
 if(!A.open){el.innerHTML="";return}
 const cats=[...new Set(prods().map(p=>p.c))].map(c=>`<option value="${esc(c)}">`).join("");
 const pr=D.promo||{};
 const b=!A.ok?`<div class="body"><h4>🔐 دخول المدير</h4><input class="in" id="ae" type="email" placeholder="البريد الإلكتروني"><input class="in" id="ac" type="password" placeholder="الكود السري"><button class="btn" style="justify-content:center" onclick="admLogin()">دخول</button><p id="am" style="color:#c0392b;font-size:13px;margin:0"></p></div>`:
 `<div class="body"><h4>➕ إضافة منتج</h4><input class="in" id="n_ar" placeholder="اسم المنتج (عربي)"><input class="in" id="n_fr" placeholder="Nom du produit (français)"><input class="in" id="n_c" list="cl" placeholder="القسم"><datalist id="cl">${cats}</datalist><input class="in" id="n_p" type="number" placeholder="سعر البيع"><input class="in" id="n_m" type="number" placeholder="سعر العضو"><input class="in" id="n_pv" placeholder="PV (اختياري)"><input class="in" id="n_o" type="number" placeholder="نسبة الخصم % (اختياري)"><input class="in" id="n_img" type="file" accept="image/*"><button class="btn" style="justify-content:center" onclick="admAdd()">إضافة المنتج</button>
 <h4>🎁 العرض الترويجي</h4><input class="in" id="p_ar" placeholder="عنوان العرض (عربي)" value="${esc(pr.ar)}"><input class="in" id="p_fr" placeholder="Titre de l’offre (français)" value="${esc(pr.fr)}"><input class="in" id="p_e" type="datetime-local" value="${esc(pr.end)}"><button class="btn" style="justify-content:center" onclick="admPromo()">حفظ العرض</button>
 <h4>📦 المنتجات (السعر والخصم)</h4><input class="in" id="aq" placeholder="بحث..." oninput="admList()"><div id="al" style="display:flex;flex-direction:column;gap:8px"></div>
 <h4>💾 النشر لكل الزوار</h4><button class="btn" style="justify-content:center" onclick="admExp()">تصدير البيانات</button><button class="btn alt" style="justify-content:center" onclick="admReset()">إلغاء تعديلات هذا الجهاز</button>
 <h4>🔑 توليد هاش كود جديد</h4><input class="in" id="hc" placeholder="الكود الجديد"><button class="btn alt" style="justify-content:center" onclick="sha(document.getElementById('hc').value).then(h=>document.getElementById('ho').value=h)">توليد</button><input class="in" id="ho" readonly placeholder="الهاش (ضعه في CFG.admin.hash)"><button class="btn alt" style="justify-content:center" onclick="admOut()">تسجيل الخروج</button></div>`;
 el.innerHTML=`<div class="ov" style="z-index:90" onclick="if(event.target===this)admClose()"><div class="side" style="max-width:560px"><header><h3>⚙️ لوحة الإدارة</h3><button class="x" onclick="admClose()">✕</button></header>${b}</div></div>`;
}
function admList(){const q=(document.getElementById("aq")||{value:""}).value.toLowerCase(),el=document.getElementById("al");if(!el)return;
 el.innerHTML=prods().filter(p=>(p.n+(p.f||"")).toLowerCase().includes(q)).map(p=>`<div class="item" style="flex-wrap:wrap"><div style="flex:1;min-width:150px"><h4>${esc(p.n)}</h4></div><label style="font-size:11px">السعر<input class="in" style="width:80px" type="number" value="${p.p}" onchange="admEdit('${p.id}','p',this.value)"></label><label style="font-size:11px">خصم %<input class="in" style="width:70px" type="number" min="0" max="90" value="${p.o||0}" onchange="admEdit('${p.id}','o',this.value)"></label><button class="x" onclick="admDel('${p.id}')">🗑</button></div>`).join("")}
function admEdit(id,f,v){v=+v;const a=D.added.find(x=>String(x.id)===id);if(a)a[f]=v;else{D.edits[id]=D.edits[id]||{};D.edits[id][f]=v}persist();draw();admList()}
function admDel(id){if(!confirm("حذف المنتج؟"))return;const i=D.added.findIndex(x=>String(x.id)===id);if(i>=0)D.added.splice(i,1);else{const b=BASE.find(x=>String(x.id)===id);if(b)D.deleted.push(b.id)}persist();draw();admList()}
function admPromo(){D.promo={ar:document.getElementById("p_ar").value,fr:document.getElementById("p_fr").value,end:document.getElementById("p_e").value};persist();S.counted=false;draw();alert("✅ تم حفظ العرض")}
function admReset(){if(!confirm("سيتم حذف تعديلات هذا الجهاز والعودة لبيانات الكود. متابعة؟"))return;try{localStorage.removeItem("dxn_data")}catch(e){}D=JSON.parse(JSON.stringify(SAVED));draw();admDraw();admList()}
function admExp(){const s=JSON.stringify(D);try{navigator.clipboard.writeText(s)}catch(e){}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"application/json"}));a.download="dxn-data.json";a.click();alert("تم تنزيل dxn-data.json ونسخ محتواه. الصقه في الكود مكان القيمة بعد const SAVED= ثم أعد رفع الصفحة ليراه كل الزوار.")}
function admAdd(){
 const g=i=>document.getElementById(i).value.trim(),n=g("n_ar"),p=+g("n_p");
 if(!n||!p)return alert("أدخل الاسم والسعر");
 const f=document.getElementById("n_img").files[0];
 const done=u=>{D.added.push({id:"a"+Date.now(),n,f:g("n_fr")||n,c:g("n_c")||"أخرى",pv:g("n_pv"),p,dp:+g("n_m")||p,o:+g("n_o")||0,e:u?`<img loading="lazy" alt="" src="${u}">`:'<span style="font-size:54px">📦</span>'});persist();draw();admDraw();admList();alert("✅ تمت إضافة المنتج")};
 if(!f)return done("");
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);done(c.toDataURL("image/jpeg",.75))};im.src=r.result};r.readAsDataURL(f)
}
document.body.insertAdjacentHTML("beforeend",'<div id="adm"></div>');
draw();

</script>
</body>
</html>
